name: RAG ingest (prod to Pinecone)

on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * *"

permissions:
  contents: write

concurrency:
  group: rag-ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    env:
      SSH_PORT: ${{ secrets.SSH_PORT }}
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USER }}
      # Chemins absolus PlanetHoster (hors web/)
      REMOTE_DRUSH: /home/fwrjwxygfy/public_html/vendor/bin/drush
      REMOTE_JSONL: /home/fwrjwxygfy/private_rag/all_athletes.jsonl
      REMOTE_RAG_DIR: /home/fwrjwxygfy/private_rag

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check secrets
        env:
          PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
          PINECONE_INDEX: ${{ secrets.PINECONE_INDEX }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          missing=0
          [ -z "$SSH_PORT" ] && echo "MANQUANT: SSH_PORT" && missing=1
          [ -z "$SSH_HOST" ] && echo "MANQUANT: SSH_HOST" && missing=1
          [ -z "$SSH_USER" ] && echo "MANQUANT: SSH_USER" && missing=1
          [ -z "$PINECONE_API_KEY" ] && echo "MANQUANT: PINECONE_API_KEY" && missing=1
          [ -z "$PINECONE_INDEX" ] && echo "MANQUANT: PINECONE_INDEX" && missing=1
          [ -z "$SSH_PRIVATE_KEY" ] && echo "MANQUANT: SSH_PRIVATE_KEY" && missing=1
          if [ -n "$SSH_PORT" ] && ! [[ "$SSH_PORT" =~ ^[0-9]+$ ]]; then
            echo "SSH_PORT invalide (espace ou retour a la ligne ?)"
            missing=1
          fi
          if [ "$missing" = "1" ]; then exit 1; fi
          echo "Secrets OK (host=$SSH_HOST user=$SSH_USER)"

      - name: Setup SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

      - name: Export entities on PlanetHoster
        run: |
          echo "SSH port=$SSH_PORT → $REMOTE_JSONL"
          ssh -p "$SSH_PORT" -i ~/.ssh/id_rsa \
            -o StrictHostKeyChecking=no -o BatchMode=yes -o ConnectTimeout=20 \
            "${SSH_USER}@${SSH_HOST}" \
            "mkdir -p ${REMOTE_RAG_DIR} && \
             ${REMOTE_DRUSH} sl-rag:export-entities --output=${REMOTE_JSONL} -y && \
             ls -la ${REMOTE_JSONL} && \
             wc -l ${REMOTE_JSONL}"

      - name: Download JSONL
        run: |
          scp -P "$SSH_PORT" -i ~/.ssh/id_rsa \
            -o StrictHostKeyChecking=no -o BatchMode=yes -o ConnectTimeout=20 \
            "${SSH_USER}@${SSH_HOST}:${REMOTE_JSONL}" \
            ./all_athletes.jsonl
          ls -la all_athletes.jsonl
          wc -l all_athletes.jsonl

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ingest.txt

      - name: Install deps
        run: pip install -r requirements-ingest.txt

      - name: Ingest to Pinecone
        env:
          PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
          PINECONE_INDEX: ${{ secrets.PINECONE_INDEX }}
        run: |
          python ingest.py --file all_athletes.jsonl
          python ingest.py --file all_athletes.jsonl --names-only

      - name: Commit names_index if changed
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add names_index.json
          git diff --staged --quiet || git commit -m "chore: refresh names_index from prod export"
          git push